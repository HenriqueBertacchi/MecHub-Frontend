<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>MecHub - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
  
  <style>
    /* --- CONFIGURAÇÃO DA TELA (BACKGROUND) --- */
    body { 
      margin: 0; 
      font-family: Arial, sans-serif; 
      /* Fundo com imagem e escurecimento para dar contraste */
      background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
      url('https://i.imgur.com/Jpui7v5.png'); 
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* --- CABEÇALHO (MENU SUPERIOR) --- */
    header {
      background-color: #000;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #333;
      position: fixed; /* Fixa o menu no topo */
      top: 0;
      width: 100%;
      box-sizing: border-box;
      z-index: 1000;
    }

    .header-logo {
      font-family: 'Archivo Black', sans-serif;
      font-size: 24px;
      text-decoration: none;
      color: white;
    }

    .header-menu {
      display: flex;
      gap: 30px; /* Espaçamento entre os links do topo */
    }

    .header-menu a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-bottom: 1px solid white; 
  
      /* Espaço para a listra não colar na letra */
      padding-bottom: 5px; 

    }

    /* Remove o efeito vermelho ao passar o mouse conforme seu gosto */
    .header-menu a:hover { 
      color: white; 
    }

    /* --- ÁREA CENTRAL (BOX DE LOGIN) --- */
    .main-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 60px; /* Espaço para não bater no cabeçalho */
    }

    .login-box {
      background: rgba(26, 26, 26, 0.9); 
      padding: 45px 40px;
      border-radius: 20px;
      border: 2px solid #000; /* Contorno preto que você destacou */
      width: 380px;
      text-align: center;
      backdrop-filter: blur(5px);
    }

    .logo-mechub { 
      font-family: 'Archivo Black', sans-serif; 
      font-size: 38px; 
      color: white; 
      margin-bottom: 30px; 
      border-bottom: 2px solid white; 
  
      /* Esse espaço faz a linha passar por trás da perninha do 'g' */
      padding-bottom: 0px; 
      
      display: inline-block;
      line-height: 1;
    }

    /* --- ENTRADAS DE DADOS (INPUTS) --- */
    .input-group { 
      margin-bottom: 20px; 
    }

    .input-group input { 
      width: 100%; 
      padding: 15px; 
      background: #000; 
      border: 1px solid #333; 
      border-radius: 30px; /* Inputs arredondados */
      color: white; 
      box-sizing: border-box; 
    }

    .input-group input:focus { 
      border-color: red; /* Destaque vermelho ao clicar no campo */
      outline: none; 
    }

    /* --- BOTÃO ENTRAR  --- */
    .btn-submit { 
      width: 200px; /* Largura reduzida para não ocupar o card todo */
      margin: 10px auto; /* Centraliza o botão no meio do card */
      display: block; 
      padding: 12px; 
      background: #DC143C; 
      color: white; 
      border: 2px solid #000; 
      border-radius: 30px; 
      font-family: 'Archivo Black', sans-serif; 
      cursor: pointer;
    }

    /* --- GOOGLE E CADASTRO --- */
    .btn-google { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 12px; 
      width: 250px; 
      margin: 30px auto 10px auto; 
      padding: 10px 15px; 
      background: white; 
      border: 2px solid #000; 
      border-radius: 8px; 
      font-weight: bold; 
      cursor: pointer; 
    }

    .register-now { 
      font-size: 14px; 
      color: #888; 
      margin-top: 25px; 
    }

    /* Link de Cadastre-se discreto */
    .back-link {
      margin-top: 20px;
      display: block;
      font-size: 13px;
      color: #555;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html" class="header-logo">MecHub</a>
    <div class="header-menu">
      <a href="index.html#servicos">Serviços</a>
      <a href="index.html#beneficios">Benefícios</a>
      <a href="index.html#quem-somos">Quem somos</a>
    </div>
  </header>

  <div class="main-content">
    <div class="login-box">
      <h1 class="logo-mechub">Login</h1>
      
      <form>
        <div class="input-group">
          <input type="email" placeholder="E-mail" required>
        </div>
        
        <div class="input-group">
          <input type="password" placeholder="Senha" required>
        </div>
        
        <button type="submit" class="btn-submit">Entrar</button>
      </form>
      
      <button type="button" class="btn-google">
        <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" width="20" height="20">
        Continuar com o Google
      </button>
      
      <p class="register-now">
        Ainda não tem conta? <a href="cadastro.html" style="color: white;">Cadastre-se</a>
      </p>

      <a href="index.html" class="back-link">← Voltar para a página principal</a>
    </div>
  </div>

</body>
</html>
