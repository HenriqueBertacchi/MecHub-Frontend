<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veículos - MecHub</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS MecHub -->
    <link rel="stylesheet" href="../css/mecanico.css">
</head>

<body>

    <div class="dashboard-layout">
        <!-- SIDEBAR UNIFICADA -->
        <aside class="sidebar">
            <div class="sidebar-brand"><span>Mec</span>Hub</div>
            <nav class="sidebar-nav">
                <a href="mecanico.html" class="nav-item">🏠 Dashboard</a>
                <a href="ordemservico.html" class="nav-item">📋 Ordens de Serviço</a>
                <a href="servicos.html" class="nav-item">🛠️ Serviços</a>
                <a href="novoservico.html" class="nav-item">➕ Novo Serviço</a>
                <a href="veiculos.html" class="nav-item ">🚗 Veículos</a>
                <a href="#" class="nav-item">👥 Clientes</a>
            </nav>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="content">
            <header class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="page-title">Frota de Veículos</h1>
                <button class="btn btn-danger fw-bold shadow-sm" data-bs-toggle="modal" data-bs-target="#modalNovoVeiculo">
                    ＋ CADASTRAR VEÍCULO
                </button>
            </header>

            <!-- TABELA DE VEÍCULOS -->
            <section class="panel-os p-4">
                <div class="table-responsive">
                    <table class="table table-dark table-hover m-0 align-middle">
                        <thead>
                            <tr>
                                <th>Placa</th> <!-- Mapeia para Placa -->
                                <th>Modelo/Marca</th> <!-- Mapeia para Modelo e Marca -->
                                <th>Cor/Ano</th> <!-- Mapeia para Cor e AnoFabricacao -->
                                <th>Proprietário</th> <!-- Mapeia para o Relacionamento Cliente -->
                                <th>Status</th> <!-- Mapeia para StatusVeiculoEnum[cite: 5] -->
                                <th class="text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Exemplo Estático do seu Skyline -->
                            <tr>
                                <td class="fw-bold text-danger">ABC-1234</td>
                                <td>Nissan Skyline R34</td>
                                <td>Azul / 1999</td>
                                <td>Henrique Silva</td>
                                <td><span class="badge bg-info">Pré-Avaliação</span></td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-outline-info me-1">✏️</button>
                                    <button class="btn btn-sm btn-outline-danger">🗑️</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL DE CADASTRO (Baseado na Model Veiculo[cite: 5]) -->
    <div class="modal fade" id="modalNovoVeiculo" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary shadow-lg">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title fw-bold">NOVO REGISTRO DE VEÍCULO</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form action="/Veiculo/Criar" method="post">
                    <div class="modal-body p-4">
                        <div class="row g-3">
                            <!-- MARCA E MODELO -->
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted">MARCA</label>
                                <input type="text" name="Marca" class="form-control input-street" placeholder="Ex: Nissan" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted">MODELO</label>
                                <input type="text" name="Modelo" class="form-control input-street" placeholder="Ex: Skyline R34" required>
                            </div>

                            <!-- PLACA, COR E ANO -->
                            <div class="col-md-4">
                                <label class="form-label small fw-bold text-muted">PLACA</label>
                                <input type="text" name="Placa" class="form-control input-street" placeholder="Ex: ABC1D23" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold text-muted">COR</label>
                                <input type="text" name="Cor" class="form-control input-street" placeholder="Ex: Azul Bayside" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold text-muted">ANO DE FABRICAÇÃO</label>
                                <input type="number" name="AnoFabricacao" class="form-control input-street" placeholder="1999" required>
                            </div>

                            <!-- VÍNCULO COM O DONO (CLIENTE) -->
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted">PROPRIETÁRIO (CLIENTE)</label>
                                <select name="ClienteId" class="form-select input-street" required>
                                    <option value="">Selecione o proprietário...</option>
                                    <option value="102">Henrique Silva</option>
                                </select>
                            </div>

                            <!-- STATUS ATUAL (ENUM) -->
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted">STATUS INICIAL</label>
                                <select name="StatusAtual" class="form-select input-street">
                                    <option value="1">1 - Pré-Avaliação</option>
                                    <option value="2">2 - Aguardando Aprovação OS</option>
                                    <option value="3">3 - Em Reparo</option>
                                    <option value="4">4 - Pronto Para Retirada</option>
                                </select>
                            </div>

                            <!-- OBSERVAÇÕES -->
                            <div class="col-12">
                                <label class="form-label small fw-bold text-muted">OBSERVAÇÕES DE STATUS</label>
                                <textarea name="ObservacaoStatus" class="form-control input-street" rows="2" placeholder="Ex: Carro chegou guinchado com fumaça no capô."></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-secondary bg-black-50">
                        <button type="button" class="btn btn-outline-light btn-sm px-4" data-bs-dismiss="modal">CANCELAR</button>
                        <button type="submit" class="btn btn-danger fw-bold px-4">SALVAR VEÍCULO</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
