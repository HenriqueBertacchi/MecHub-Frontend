<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novo Serviço</title>
    <!-- Bootstrap 5 (Base de estrutura) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Único CSS Personalizado (Alma do MecHub) -->
    <link rel="stylesheet" href="../css/mecanico.css">
</head>

<body>

    <div class="dashboard-layout">
        <!-- SIDEBAR UNIFICADA -->
        <aside class="sidebar">
            <div class="sidebar-brand"><span>Mec</span>Hub</div>
            <nav class="sidebar-nav">
                <a href="mecanico.html" class="nav-item">🏠 Dashboard</a>
                <a href="ordemservico.html" class="nav-item">📋 Ordens de Serviço</a>
                <a href="servicos.html" class="nav-item">🛠️ Serviços</a>
                <a href="novoservico.html" class="nav-item">➕ Novo Serviço</a>
                <a href="veiculos.html" class="nav-item ">🚗 Veículos</a>
                <a href="#" class="nav-item">👥 Clientes</a>
            </nav>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="content">
            <header class="mb-4">
                <h1 class="page-title">Cadastrar Novo Serviço</h1>
                <p class="text-muted">Adicione novos itens ao seu catálogo de mão de obra e peças</p>
            </header>

            <section class="panel-os p-4">
                <!-- O action aponta para a rota que o C# vai usar depois -->
                <form action="/Servico/Criar" method="post">

                    <div class="row g-3 mb-4">
                        <div class="col-md-8">
                            <label class="form-label fw-bold">NOME DO SERVIÇO</label>
                            <!-- O name="Nome" deve bater com a sua Model Servico.cs[cite: 1] -->
                            <input type="text" name="Nome" class="form-control input-street"
                                placeholder="Ex: Troca de Óleo Sintético" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">VALOR (R$)</label>
                            <!-- O name="Preco" deve bater com a sua Model Servico.cs[cite: 1] -->
                            <input type="number" step="0.01" name="Preco" class="form-control input-street"
                                placeholder="0,00" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">DESCRIÇÃO DETALHADA (OPCIONAL)</label>
                        <textarea name="Descricao" class="form-control input-street" rows="4"
                            placeholder="Detalhes técnicos sobre o serviço..."></textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger px-5 fw-bold">SALVAR SERVIÇO</button>
                        <a href="servicos.html" class="btn btn-outline-light px-4">CANCELAR</a>
                    </div>
                </form>
            </section>
        </main>

        <!-- Script do Bootstrap (Essencial para Dropdowns e Modais) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
