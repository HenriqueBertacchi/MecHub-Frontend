<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>MecHub - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
  
  <style>
/* BODY */
body { 
  margin: 0; 
  font-family: Arial, sans-serif; 
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* 🔥 IMAGEM DE FUNDO */
.bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 60% center;
  z-index: -1;
  filter: brightness(0.5);
}

/* HEADER */
header {
  background-color: #000;
  padding: 15px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid #333;
  position: fixed;
  top: 0;
  width: 100%;
  box-sizing: border-box;
  z-index: 1000;
}

.header-logo {
  font-family: 'Archivo Black', sans-serif;
  font-size: 24px;
  text-decoration: none;
  color: white;
}

.header-menu {
  display: flex;
  gap: 30px;
}

.header-menu a {
  color: white;
  text-decoration: none;
  font-weight: bold;
  border-bottom: 1px solid white; 
  padding-bottom: 5px; 
}

/* MAIN */
.main-content {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-top: 80px;
}

/* CARD */
.login-box {
  background: rgba(26, 26, 26, 0.7); 
  padding: 45px 40px;
  border-radius: 20px;
  border: 2px solid #000;
  width: 380px;
  text-align: center;
  backdrop-filter: blur(10px);
}

/* TÍTULO */
.logo-mechub { 
  font-family: 'Archivo Black', sans-serif; 
  font-size: 38px; 
  color: white; 
  margin-bottom: 30px; 
  border-bottom: 2px solid white; 
  padding-bottom: 0px; 
  display: inline-block;
  line-height: 1;
}

/* INPUT */
.input-group { 
  margin-bottom: 20px; 
}

.input-group input { 
  width: 100%; 
  padding: 15px; 
  background: #000; 
  border: 1px solid #333; 
  border-radius: 30px; 
  color: white; 
  box-sizing: border-box; 
}

.input-group input:focus { 
  border-color: red;
  outline: none; 
}

/* BOTÃO */
.btn-submit { 
  width: 200px;
  margin: 10px auto;
  display: block; 
  padding: 12px; 
  background: #DC143C; 
  color: white; 
  border: 2px solid #000; 
  border-radius: 30px; 
  font-family: 'Archivo Black', sans-serif; 
  cursor: pointer;
}

/* VOLTAR */
.back-link {
  margin-top: 20px;
  display: block;
  font-size: 13px;
  color: #aaa;
  text-decoration: none;
}
  </style>
</head>

<body>

  <!-- 🔥 FUNDO -->
  <img src="https://i.imgur.com/GlJ2fgb.png" class="bg">

  <header>
    <a href="index.html" class="header-logo">MecHub</a>
    <div class="header-menu">
      <a href="index.html#servicos">Serviços</a>
      <a href="index.html#beneficios">Benefícios</a>
      <a href="index.html#quem-somos">Quem somos</a>
    </div>
  </header>

  <div class="main-content">
    <div class="login-box">
      <h1 class="logo-mechub">Consultar</h1>
      
      <form>
        <div class="input-group">
          <input type="text" placeholder="Digite a placa do veículo" required>
        </div>

        <button type="submit" class="btn-submit">Entrar</button>
      </form>

      <a href="index.html" class="back-link">← Voltar para a página principal</a>
    </div>
  </div>

</body>
</html>
