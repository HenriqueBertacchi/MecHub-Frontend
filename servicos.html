<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo de Serviços - MecHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/mecanico.css">
</head>

<body>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-brand"><span>Mec</span>Hub</div>
            <nav class="sidebar-nav">
                <a href="mecanico.html" class="nav-item">🏠 Dashboard</a>
                <a href="ordemservico.html" class="nav-item">📋 Ordens de Serviço</a>
                <a href="servicos.html" class="nav-item">🛠️ Serviços</a>
                <a href="novoservico.html" class="nav-item">➕ Novo Serviço</a>
                <a href="veiculos.html" class="nav-item ">🚗 Veículos</a>
                <a href="#" class="nav-item">👥 Clientes</a>
            </nav>
        </aside>

        <main class="content">
            <header class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="page-title">Catálogo de Serviços</h1>
                <button class="btn btn-danger fw-bold shadow-sm" data-bs-toggle="modal" data-bs-target="#modalNovoServico">
                    ＋ NOVO ITEM NO MENU
                </button>
            </header>

            <section class="panel-os p-4">
                <div class="table-responsive">
                    <table class="table table-dark table-hover m-0 align-middle">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Descrição</th>
                                <th>Categoria</th>
                                <th>Preço Sugerido</th>
                                <th class="text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>#1</td>
                                <td>Troca de Óleo (Sintético)</td>
                                <td><span class="badge bg-secondary">Manutenção</span></td>
                                <td class="text-danger fw-bold">R$ 250,00</td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-outline-info">✏️</button>
                                    <button class="btn btn-sm btn-outline-danger">🗑️</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL DE CADASTRO -->
    <div class="modal fade" id="modalNovoServico" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary shadow-lg">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title fw-bold">CADASTRAR NOVO SERVIÇO</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form action="/Servicos/Criar" method="post">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">DESCRIÇÃO DO SERVIÇO</label>
                            <input type="text" name="Descricao" class="form-control input-street" placeholder="Ex: Higienização de Ar Condicionado" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold small text-muted">CATEGORIA</label>
                                <select name="Tipo" class="form-select input-street" required>
                                    <option value="Manutenção">Manutenção</option>
                                    <option value="Suspensão">Suspensão</option>
                                    <option value="Estética">Estética</option>
                                    <option value="Motor">Motor</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold small text-muted">VALOR BASE (R$)</label>
                                <input type="number" step="0.01" name="Valor" class="form-control input-street" placeholder="0.00" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-secondary bg-black-50">
                        <button type="button" class="btn btn-outline-light btn-sm" data-bs-dismiss="modal">CANCELAR</button>
                        <button type="submit" class="btn btn-danger fw-bold px-4">SALVAR NO CATÁLOGO</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
